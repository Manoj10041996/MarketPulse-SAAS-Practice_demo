[project]
name = "marketpulse-backend"
version = "0.1.0"
description = "MarketPulse backend API"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=0.120.0",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.2",
    "langchain-tavily>=0.2.18",
    "pydantic-settings>=2.14.2",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
