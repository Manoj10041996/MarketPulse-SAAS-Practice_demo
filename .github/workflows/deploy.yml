name: Deploy

# Runs only after the "CI" workflow finishes on main, and only if it
# succeeded. This keeps deploy in its own file while still gating it on
# the checks in ci.yml passing first.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  PROJECT_ID: marketpulse-saas-503410
  REGION: us-central1
  REPOSITORY: marketpulse-saas-repo
  SERVICE: marketpulse-saas
  IMAGE: us-central1-docker.pkg.dev/marketpulse-saas-503410/marketpulse-saas-repo/marketpulse-saas

jobs:
  # Builds the Docker image, pushes it to Artifact Registry, and deploys it
  # to Cloud Run.
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Checks out the exact commit that CI just validated, not whatever
      # is latest on main by the time this workflow starts.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Authenticates gcloud/docker as the service account whose key is
      # stored in the repo secret GCP_SA_KEY.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Lets `docker push` authenticate against Artifact Registry using the
      # credentials from the step above.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }} -t ${{ env.IMAGE }}:latest ./backend

      - name: Push Docker image to Artifact Registry
        run: |
          docker push ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }}
          docker push ${{ env.IMAGE }}:latest

      # --max-instances=1 caps how far this can scale, so a traffic spike
      # can't turn into a surprise bill.
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }}
          project_id: ${{ env.PROJECT_ID }}
          flags: --allow-unauthenticated --max-instances=1 --port=8000

      # Prints the live application URL both in the logs and in the
      # run's summary page so it's easy to find without digging through logs.
      - name: Show application URL
        run: |
          echo "Application URL: ${{ steps.deploy.outputs.url }}"
          echo "### Deployed to Cloud Run" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
