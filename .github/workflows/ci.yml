name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main1]

jobs:
  # Basic sanity checks: install deps, make sure the app imports, and the
  # /health endpoint actually responds.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify app imports
        run: uv run python -c "import main"

      - name: Smoke test /health endpoint
        run: |
          uv run uvicorn main:app --port 8000 &
          for i in $(seq 1 10); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
