name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main1]

jobs:
  # Basic sanity checks: install deps, make sure the app imports, and the
  # /health endpoint actually responds.
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Harmless placeholders, not real secrets — just enough for Settings'
    # fail-fast validation to pass so the app can boot for the smoke test
    # below. /health never touches Oxylabs/Anthropic/Tavily, so no real
    # credentials are needed here.
    env:
      ANTHROPIC_API_KEY: ci-placeholder
      TAVILY_API_KEY: ci-placeholder
      OXYLABS_USERNAME: ci-placeholder
      OXYLABS_PASSWORD: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify app imports
        run: uv run python -c "import app.main"

      - name: Smoke test /health endpoint
        run: |
          uv run uvicorn app.main:app --port 8000 &
          for i in $(seq 1 10); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
