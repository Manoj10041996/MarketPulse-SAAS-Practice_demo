name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main1]

env:
  PROJECT_ID: marketpulse-saas-503410
  REGION: us-central1
  REPOSITORY: marketpulse-saas-repo
  SERVICE: marketpulse-saas
  IMAGE: us-central1-docker.pkg.dev/marketpulse-saas-503410/marketpulse-saas-repo/marketpulse-saas

jobs:
  # Basic sanity checks: install deps, make sure the app imports, and the
  # /health endpoint actually responds. Nothing below this job runs unless
  # these checks pass.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify app imports
        run: uv run python -c "import main"

      - name: Smoke test /health endpoint
        run: |
          uv run uvicorn main:app --port 8000 &
          for i in $(seq 1 10); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done

  # Builds the Docker image, pushes it to Artifact Registry, and deploys it
  # to Cloud Run. Only runs for pushes to main (not pull requests), and only
  # after the "checks" job above has passed.
  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Authenticates gcloud/docker as the service account whose key is
      # stored in the repo secret GCP_SA_KEY (see setup notes below).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Lets `docker push` authenticate against Artifact Registry using the
      # credentials from the step above.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      # --max-instances=1 caps how far this can scale, so a traffic spike
      # can't turn into a surprise bill.
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          project_id: ${{ env.PROJECT_ID }}
          flags: --allow-unauthenticated --max-instances=1 --port=8000

      # Prints the live application URL both in the logs and in the
      # run's summary page so it's easy to find without digging through logs.
      - name: Show application URL
        run: |
          echo "Application URL: ${{ steps.deploy.outputs.url }}"
          echo "### Deployed to Cloud Run" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
